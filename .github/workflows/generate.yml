name: AI記事生成

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gemini SDKをインストール
        run: |
          pip install google-genai

      - name: AIに記事を書かせる
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_article.py

      - name: サイトを更新
        run: |
          git config user.name "AI Editor"
          git config user.email "ai-editor@example.com"
          git add index.html article.html
          git commit -m "AIが記事を生成しました" || echo "変更なし"
          git push
