<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI日報</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.8;
            background: #f5f5f5;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 36px;
        }

        .subtitle {
            color: #666;
        }

        article {
            background: white;
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 12px;
        }

        .date {
            color: #888;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>AI日報</h1>
    <p class="subtitle">AIが毎日の記事を作る実験サイト</p>
</header>

<main>

    <article>
        <p class="date">2026年8月25日</p>

        <h2>AIによるサイト運営実験、始まる</h2>

        <p>
            このサイトは、AIが記事の作成や更新を行う
            「AIによる自律的なサイト運営」を実験するためのサイトです。
        </p>

        <p>
            現在は人間が記事を用意していますが、
            今後はAI自身が記事のテーマを決め、
            文章を作成し、サイトを更新する仕組みを構築していきます。
        </p>
    </article>

</main>

</body>
</html>
